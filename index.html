<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="hiho-html-viewerで公開しているHTMLページの一覧"
    />
    <title>HTML Viewer</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-950 antialiased">
    <main class="mx-auto w-full max-w-6xl px-6 py-16 sm:px-10 sm:py-24">
      <header class="max-w-3xl">
        <p class="text-sm font-semibold tracking-widest text-sky-700 uppercase">
          hiho-html-viewer
        </p>
        <h1 class="mt-4 text-4xl font-bold tracking-tight sm:text-6xl">
          公開ページ
        </h1>
        <p class="mt-5 text-lg leading-8 text-slate-600">
          GitHub Pagesで配信しているHTMLページの一覧です。
        </p>
      </header>

      <section class="mt-14" aria-labelledby="pages-heading">
        <div class="mb-6 flex items-end justify-between gap-6 border-b border-slate-300 pb-4">
          <h2 id="pages-heading" class="text-2xl font-semibold tracking-tight">
            ページ一覧
          </h2>
          <p class="text-sm text-slate-500">パス順</p>
        </div>
        <div data-page-list></div>
      </section>

      <footer class="mt-16 border-t border-slate-300 pt-6 text-sm text-slate-500">
        GitHub Pagesで配信しています。
      </footer>
    </main>
  </body>
</html>
