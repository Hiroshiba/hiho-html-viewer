name: GitHub Pagesへデプロイ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7
      - name: pnpmを準備
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.2
      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 静的解析を実行
        run: pnpm run lint
      - name: 型を検査
        run: pnpm run typecheck
      - name: テストを実行
        run: pnpm run test
      - name: 公開ファイルを生成
        run: pnpm run build
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v6
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
